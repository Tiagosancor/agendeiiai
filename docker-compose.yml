name: plataforma

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plataforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plataforma_dev}
      POSTGRES_DB: ${POSTGRES_DB:-plataforma}
    ports:
      # 5434 no host: 5432 e 5433 costumam já estar ocupadas por outros projetos locais.
      - "${POSTGRES_PORTA_HOST:-5434}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plataforma} -d ${POSTGRES_DB:-plataforma}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Padrao: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-plataforma};Username=${POSTGRES_USER:-plataforma};Password=${POSTGRES_PASSWORD:-plataforma_dev}"
      Marca__NomeProduto: ${MARCA_NOME_PRODUTO:-Agendeiiai}
      Marca__Dominio: ${MARCA_DOMINIO:-agendeiiai.localhost}
      Marca__EmailRemetente: ${MARCA_EMAIL_REMETENTE:-nao-responda@agendeiiai.localhost}
      # Esquema/porta da página pública, usados para montar os links de cancelar/remarcar
      # nos e-mails (seção 6.3) — em produção, deixe PORTA_URL_PUBLICA vazia (porta padrão do esquema).
      Marca__EsquemaUrlPublica: ${MARCA_ESQUEMA_URL_PUBLICA:-http}
      Marca__PortaUrlPublica: ${MARCA_PORTA_URL_PUBLICA:-3000}
      Jwt__ChaveSecreta: ${JWT_CHAVE_SECRETA:?defina JWT_CHAVE_SECRETA no .env (openssl rand -base64 64)}
      Jwt__Emissor: ${JWT_EMISSOR:-plataforma-dev}
      Jwt__Audiencia: ${JWT_AUDIENCIA:-plataforma-painel-dev}
      Cpf__ChaveId: ${CPF_CHAVE_ID:-dev-v1}
      Cpf__ChaveBase64: ${CPF_CHAVE_BASE64:?defina CPF_CHAVE_BASE64 no .env (openssl rand -base64 32)}
      # Código de confirmação (seção 8.1) — pimenta do hash, nunca o código em si. Gere com: openssl rand -base64 32
      Verificacao__ChaveHmac: ${VERIFICACAO_CHAVE_HMAC:?defina VERIFICACAO_CHAVE_HMAC no .env (openssl rand -base64 32)}
      # E-mail/WhatsApp reais são opt-in — sem essas variáveis, os provedores Fake cobrem
      # dev e testes (seção 4). Defina EMAIL_PROVEDOR=Resend / WHATSAPP_PROVEDOR=Oficial
      # (e as chaves correspondentes) só quando as contas reais (seção 12) existirem.
      Email__Provedor: ${EMAIL_PROVEDOR:-Fake}
      Email__Resend__ApiKey: ${RESEND_API_KEY:-}
      WhatsApp__Provedor: ${WHATSAPP_PROVEDOR:-Fake}
      WhatsApp__Meta__Token: ${WHATSAPP_TOKEN_ACESSO:-}
      WhatsApp__Meta__NumeroTelefoneId: ${WHATSAPP_ID_NUMERO_TELEFONE:-}
      WhatsApp__PermitirNaoOficial: ${WHATSAPP__PERMITIRNAOOFICIAL:-false}
      # Evolution API (não oficial — seção 4): só com WHATSAPP_PROVEDOR=EvolutionApi E
      # WHATSAPP__PERMITIRNAOOFICIAL=true. Suba a instância com: docker compose --profile whatsapp up -d
      WhatsApp__Evolution__UrlBase: ${EVOLUTION_URL_BASE:-http://evolution:8080}
      WhatsApp__Evolution__ChaveApi: ${EVOLUTION_CHAVE_API:-}
      WhatsApp__Evolution__NomeInstancia: ${EVOLUTION_NOME_INSTANCIA:-agendeiiai-dev}
      WhatsApp__Evolution__SegredoWebhook: ${EVOLUTION_SEGREDO_WEBHOOK:-}
      # Agente de WhatsApp (Fase 1): instância por negócio na Evolution + webhook por instância
      # (POST /webhooks/whatsapp/{segredo}). Vazios = o agente fica desligado (webhook 404, painel 502).
      Evolution__BaseUrl: ${AGENTE_EVOLUTION_URL_BASE:-http://evolution:8080}
      Evolution__ApiKey: ${AGENTE_EVOLUTION_CHAVE_API:-}
      Whatsapp__WebhookSecret: ${AGENTE_WEBHOOK_SEGREDO:-}
      Whatsapp__UrlPublicaApi: ${AGENTE_URL_PUBLICA_API:-http://api:8080}
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379}
      # Agente de WhatsApp (Fase 2): IA. Padrão Eco = comportamento da Fase 1 (dev/e2e sem chave).
      Ai__Provider: ${AI_PROVIDER:-Eco}
      Ai__Gemini__ApiKey: ${AI_GEMINI_API_KEY:-}
      Ai__Gemini__Model: ${AI_GEMINI_MODEL:-gemini-3.1-flash-lite}
      Ai__Gemini__ModeloReserva: ${AI_GEMINI_MODELO_RESERVA:-}
      Ai__NegociosHabilitados: ${AI_NEGOCIOS_HABILITADOS:-}
      Ai__LimiteMensagensPorTelefonePorHora: ${AI_LIMITE_MENSAGENS_TELEFONE_HORA:-15}
      Ai__LimiteMensagensPorTelefonePorDia: ${AI_LIMITE_MENSAGENS_TELEFONE_DIA:-45}
      Ai__LimiteChamadasPorNegocioPorDia: ${AI_LIMITE_CHAMADAS_NEGOCIO_DIA:-250}
      Ai__CotaMensalTokensPorNegocio: ${AI_COTA_MENSAL_TOKENS:-1500000}
      Ai__Gemini__TimeoutSegundos: ${AI_GEMINI_TIMEOUT_SEGUNDOS:-15}
      Ai__TempoMaximoProcessamentoSegundos: ${AI_TEMPO_MAXIMO_PROCESSAMENTO_SEGUNDOS:-40}
      Ai__MaxMensagensHistorico: ${AI_MAX_MENSAGENS_HISTORICO:-20}
      Ai__DiasMaximosConsulta: ${AI_DIAS_MAXIMOS_CONSULTA:-60}
      Ai__Gemini__UrlBase: ${AI_GEMINI_URL_BASE:-https://generativelanguage.googleapis.com/v1beta}
      Ai__MaxIteracoesFerramentas: ${AI_MAX_ITERACOES_FERRAMENTAS:-5}
      Ai__MaxChamadasFerramentaPorIteracao: ${AI_MAX_CHAMADAS_FERRAMENTA_ITERACAO:-3}
      Ai__MaxCaracteresMensagem: ${AI_MAX_CARACTERES_MENSAGEM:-1000}
      Ai__MaxCaracteresHistorico: ${AI_MAX_CARACTERES_HISTORICO:-8000}
      Ai__MaxTokensSaida: ${AI_MAX_TOKENS_SAIDA:-1536}
      Ai__MaxCaracteresResposta: ${AI_MAX_CARACTERES_RESPOSTA:-1000}
      Ai__Agendamento__Modo: ${AI_AGENDAMENTO_MODO:-Desligado}
      Ai__Agendamento__Negocios: ${AI_AGENDAMENTO_NEGOCIOS:-}
      Ai__Agendamento__LimitePreparosPorTelefonePorDia: ${AI_AGENDAMENTO_LIMITE_PREPAROS_DIA:-5}
      Ai__Agendamento__LimiteFuturosPorTelefone: ${AI_AGENDAMENTO_LIMITE_FUTUROS:-3}
      Ai__Agendamento__LimiteConfirmacoesPorTelefonePorDia: ${AI_AGENDAMENTO_LIMITE_CONFIRMACOES_DIA:-3}
      Ai__Agendamento__LimiteReservasAtivasPorNegocio: ${AI_AGENDAMENTO_LIMITE_RESERVAS_NEGOCIO:-20}
      Ai__AvisoAutomatizadoDias: ${AI_AVISO_AUTOMATIZADO_DIAS:-90}
      Ai__RegistrarRodadas: ${AI_REGISTRAR_RODADAS:-true}
      Ai__RetencaoRodadasDias: ${AI_RETENCAO_RODADAS_DIAS:-90}
      # Instruções do pagamento manual da assinatura (seção 7), enquanto não há gateway.
      Cobranca__ChavePix: ${COBRANCA_CHAVE_PIX:-}
      Cobranca__WhatsAppContato: ${COBRANCA_WHATSAPP_CONTATO:-}
      # Cloudflare Turnstile no cadastro (seção 8.6.1). Vazio = captcha desligado.
      Captcha__ChaveSecreta: ${TURNSTILE_CHAVE_SECRETA:-}
    ports:
      - "${API_PORTA_HOST:-5080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Embutida no bundle do navegador em tempo de build — precisa ser o endereço que
        # o NAVEGADOR alcança (porta publicada no host), não o nome do serviço Docker.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5080}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Lidas em runtime por middleware/server components (sem prefixo NEXT_PUBLIC_,
      # então não dependem de build-time inlining — ver docs/decisoes.md).
      MARCA_DOMINIO: ${MARCA_DOMINIO:-agendeiiai.localhost}
      MARCA_NOME_PRODUTO: ${MARCA_NOME_PRODUTO:-Agendeiiai}
      API_URL_INTERNA: http://api:8080
      TURNSTILE_CHAVE_SITE: ${TURNSTILE_CHAVE_SITE:-}
      # "Fale com a gente" e contato do site do produto (seção 6.4) — o mesmo número da cobrança.
      CONTATO_WHATSAPP: ${COBRANCA_WHATSAPP_CONTATO:-}
    ports:
      - "${FRONTEND_PORTA_HOST:-3000}:3000"

  # Redis do agente de WhatsApp: deduplicação de webhook (SET NX EX 600). Sem porta no host. Se cair, o webhook
  # segue e o índice único do banco barra a duplicata.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Instância local do Evolution API (WhatsApp NÃO oficial — viola os termos do WhatsApp e pode
  # levar ao banimento do número; seção 4). Opcional: só sobe com --profile whatsapp. Guarda os
  # dados no schema "evolution" do mesmo Postgres (o EF só usa o "public"). O webhook global aponta
  # para a API com o segredo na URL (POST /webhooks/evolution/status?token=...).
  evolution:
    image: evoapicloud/evolution-api:v2.3.0
    profiles: ["whatsapp"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_URL: http://localhost:${EVOLUTION_PORTA_HOST:-8081}
      # Defina EVOLUTION_CHAVE_API no .env (openssl rand -hex 24) antes de subir o profile.
      AUTHENTICATION_API_KEY: ${EVOLUTION_CHAVE_API:-}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER:-plataforma}:${POSTGRES_PASSWORD:-plataforma_dev}@postgres:5432/${POSTGRES_DB:-plataforma}?schema=evolution"
      DATABASE_CONNECTION_CLIENT_NAME: evolution_dev
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: "http://api:8080/webhooks/evolution/status?token=${EVOLUTION_SEGREDO_WEBHOOK:-}"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
    ports:
      - "${EVOLUTION_PORTA_HOST:-8081}:8080"
    volumes:
      - instancias_evolution:/evolution/instances

volumes:
  dados_postgres:
  instancias_evolution:
